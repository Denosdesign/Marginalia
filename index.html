/* The default layout is for a narrow reading viewport. */
:root{--muted:#626059;--line:#d9d6ce;--gutter:clamp(18px,5vw,32px)}
[hidden]{display:none!important}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button,summary{touch-action:manipulation}
summary{cursor:pointer}
main{max-width:none;padding:24px var(--gutter) calc(90px + env(safe-area-inset-bottom))}
header.top{position:relative;flex-wrap:nowrap;padding:calc(8px + env(safe-area-inset-top)) var(--gutter) 8px;min-height:57px;gap:16px}
.brand{padding:8px 0;font-size:26px;min-height:44px}
#status:empty{display:none}
#moreMenu{position:relative;margin-left:auto}
#moreMenu summary{display:flex;align-items:center;gap:5px;min-height:44px;font-size:14px}
#moreMenu summary::after{content:"▾";font-size:11px}
#moreMenu div{position:absolute;right:0;top:100%;width:164px;background:var(--paper);border:1px solid var(--line);padding:5px;z-index:30}
#moreMenu button{display:block;width:100%;text-align:left;border:0;min-height:44px}
#nav{position:fixed;inset:auto 0 0;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;overflow:visible;padding:0 max(6px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--paper)}
#nav button{padding:0 2px;min-height:52px;margin:0;font-size:13px;border-top:2px solid transparent}
#nav button.on{font-weight:650;border-top-color:var(--ink);border-bottom:0}
body:has(.active-review) header.top{display:none}
@media(max-width:849px){
  body:has(.reader-layout) header.top{display:none}
  body:has(.reader-layout) main{padding-top:calc(8px + env(safe-area-inset-top))}
}
body:has(.reader-layout) main,body:has(.active-review) main{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
body:has(.active-review) main{padding-top:calc(16px + env(safe-area-inset-top))}
.page-narrow{max-width:720px;margin-inline:auto}
.page-title{font-size:clamp(32px,7vw,48px);letter-spacing:-.9px;margin-bottom:22px}
.sectionhead{margin:28px 0 10px}
.sectionhead h2,.today-feature h2{font-size:clamp(22px,5vw,28px);letter-spacing:-.4px}
.meta{font-size:13px;line-height:1.4}
.notice{font-size:14px}
.today-feature .tile{border:0;padding-top:8px}
.today-feature .tile h3{font-size:clamp(26px,6vw,36px);max-width:34ch}
.tile{padding:15px 0 18px;gap:6px;align-items:start}
.tile h3{font-size:clamp(22px,5.2vw,27px);cursor:inherit}
.tile p{font-size:15px}
.article-title{border:0;text-align:left;font:inherit;padding:0;min-height:44px;line-height:1.16}
.article-title:hover,.brand:hover,button.text:hover{background:transparent;text-decoration:underline}
.tile .primary{margin-top:9px;min-height:46px}
.today-review{display:flex;justify-content:space-between;align-items:center;border-block:1px solid var(--line);padding:2px 0;margin-top:8px}
.today-review button,.bulk-action button{min-height:44px}
.library-search{margin-bottom:14px}
.library-search input,.page-narrow .filters input,.page-narrow .filters select{font-size:16px;min-height:44px}
#libraryFilters summary{min-height:44px;padding:11px 0}
.filter-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(145px,100%),1fr));gap:12px;padding:0 0 12px}
.filter-options label,.filter-options select{margin:0;width:100%}
.filter-options select{font-size:16px;min-height:44px}
.reader-layout{max-width:650px;margin:auto;display:grid;gap:0}
.reader-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 4px;background:var(--paper);border-bottom:1px solid var(--line)}
.reader-bar .reader-back{min-height:44px;text-align:left}
.reader-font{display:inline-flex;align-items:center;flex:none}
.reader-font button{padding:0;width:44px;height:44px;border:0;font-size:16px}
.reader-font button[aria-disabled=true]{color:var(--muted);opacity:.55;cursor:default}

@media(max-width:849px){

}
.reader-head{max-width:none;margin:0;padding:20px 0 0;border-color:var(--line);min-width:0}

#readerOptions summary{padding-block:11px}

.reader-options{background:var(--soft);padding:5px 12px 8px}

#voiceStatus:empty{display:none}
#voiceStatus{font-size:13px}
.side{display:none}
.reading{font-size:var(--read);line-height:1.63;min-width:0;padding-top:1.05em;overflow-anchor:none}

.reader-bottom{max-width:none;width:100%;min-width:0}
.reader-finish{border-block:1px solid var(--line);padding:2px 0 8px}
.reader-finish summary,.lesson-section summary,.review-source summary{padding:10px 0;min-height:44px}
.reader-finish p,.lesson-section p{margin:0 0 12px}
.lesson-section{border-top:1px solid var(--line);margin-top:12px}
.lesson-section summary{font-size:16px}
.bulk-action{display:flex;justify-content:flex-end}
.vocab-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;border-top:1px solid var(--line);padding:4px 0}
.vocab-entry summary{min-height:52px;display:block;padding:9px 0;line-height:1.35;overflow-wrap:anywhere}
.vocab-entry summary::before{content:'›';display:inline-block;width:16px}
.vocab-entry details[open] summary::before{transform:rotate(90deg);transform-origin:5px center}
.vocab-entry summary strong{font-size:16px}
.vocab-entry summary span{display:block;margin:3px 0 0 16px;color:var(--muted);font-size:14px}
.vocab-detail{padding:2px 0 12px 16px}
.vocab-detail p{margin:4px 0 7px}
.vocab-detail .example{font:italic 17px/1.4 var(--serif)}
.vocab-source button{display:block;min-height:44px;text-align:left;font-size:13px}
.quiet-action{background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding-inline:8px}
.quiet-action:disabled{text-decoration:none}
.review-overview{border-block:1px solid var(--line);padding:14px 0}
.review-overview h2{font-size:27px;margin-bottom:10px}
.review-overview .primary{min-height:46px}
.review-preference{display:flex;align-items:center;gap:8px;margin:0 0 8px;min-height:44px;font-size:14px}
.review-preference input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.review-card{min-height:190px;padding:20px var(--gutter)}
.review-card .review-audio{justify-content:center;margin:0}
.review-toolbar .eyebrow,.review-card .eyebrow{font-size:13px;letter-spacing:0;text-transform:none}
.review-answer h2,.review-card h2{scroll-margin-top:16px}
.review-source button{display:block;text-align:left;min-height:44px}
#lessonLanguage,#articleHighlights,.reading h2{scroll-margin-top:calc(64px + env(safe-area-inset-top))}
body:has(#nav) .toast{bottom:calc(66px + env(safe-area-inset-bottom))}
body:has(.reader-layout) .toast,body:has(.active-review) .toast{bottom:calc(14px + env(safe-area-inset-bottom))}
@media(min-width:850px){
  header.top{padding-inline:max(var(--gutter),calc((100vw - 1080px) / 2));position:relative}
  #moreMenu{margin-left:0}
  #nav{position:static;inset:auto;width:auto;display:flex;gap:22px;border:0;padding:0}

  body:has(.reader-layout) #nav{display:flex}
  main{padding:36px var(--gutter) 60px}

}

ars.','C1'],['Put pressure on','對……造成壓力','Create additional strain or difficulty.','Rising rents are putting pressure on young people’s finances.','B2'],['Struggle to afford','難以負擔','Have difficulty paying for something.','Many elderly residents struggle to afford private healthcare.','B2'],['Place a burden on','加重……的負擔','Impose a cost or difficulty on someone.','Higher costs place a burden on taxpayers.','B2'],['Address the needs of','回應……的需要','Take action to meet the needs of a group.','The government needs to address the needs of an ageing population.','B2']],language:[{title:'Whereas',explanation:'Contrast two groups or situations.',quote:'Wealthier households may be able to absorb the additional costs, whereas families on modest incomes may have little choice but to cut back on other essential spending.',examples:['Some employees enjoy flexible working arrangements, whereas others are required to be physically present at work.']},{title:'Have little choice but to',explanation:'Express how circumstances limit someone’s options, rather than personal preference.',quote:'Families on modest incomes may have little choice but to cut back on other essential spending.',examples:['Many young adults have little choice but to live with their parents.','Small businesses may have little choice but to raise their prices.']}],analysis:'International energy shocks can increase wholesale costs, raise household expenses and put pressure on public finances. Universal subsidies may be easier to access but cost more; targeted support can focus resources on households in greater need but requires eligibility assessment. Energy efficiency offers longer term benefits but limited immediate relief.',question:'Should the government provide financial assistance to all households, or should support be limited to those on lower incomes?'},{id:'tai-po-2026-11-26',title:'One year after the Tai Po fire, Hong Kong remembers its victims and demands accountability',date:'2026-11-26',region:'Hong Kong',category:'Society & Governance',type:'News analysis',level:'B2 / B2+',source:'Associated Press / Reuters / CNA / SCMP (as cited in lesson)',sourceUrl:'',verified:false,description:'Remembrance, building safety, residents’ recovery and the meaning of public accountability.',sections:[{id:'a',heading:'A city remembers',paragraphs:['On 26 November 2026, Hong Kong marked the first anniversary of the devastating fire at Wang Fuk Court in Tai Po. The blaze, which broke out during renovation work a year earlier, killed 168 people and forced thousands of residents from their homes.','Mourners gathered near the estate to lay flowers, offer prayers and pay tribute to those who had lost their lives. At a cathedral in central Hong Kong, the names of the victims were read aloud one by one.','For many families, the anniversary was not only a time of remembrance, but also a reminder of the questions that remain unanswered.']},{id:'b',heading:'Failures beyond the fire',paragraphs:['An official investigation found that the disaster was made worse by substandard construction materials, improper practices during renovation work and inadequate regulatory oversight.','The fire is believed to have started with a discarded cigarette before spreading rapidly through materials covering the buildings.','The findings have raised serious concerns about how building maintenance projects are supervised and whether existing safety regulations are properly enforced.','Some residents had reportedly raised concerns about fire hazards before the disaster, prompting questions about why those warnings did not lead to effective action.']},{id:'c',heading:'Accountability remains a central concern',paragraphs:['Following the publication of the investigation report in October, Chief Executive John Lee apologised, while the housing minister resigned to take political responsibility.','The government has pledged to strengthen building safety regulations and address weaknesses identified by the investigation.','However, some survivors and relatives of the victims believe that more needs to be done to ensure accountability.','Human Rights Watch has also criticised the authorities’ handling of public criticism surrounding the tragedy. The government, meanwhile, maintains that lawful activities are permitted and says it remains committed to investigations and reform.']},{id:'d',heading:'Rebuilding lives and restoring trust',paragraphs:['Beyond the investigations, survivors continue to face practical and emotional difficulties.','Many have struggled to rebuild their lives after losing their homes, possessions and loved ones. The government recently announced additional financial assistance of up to HK$300,000 for eligible victims.','Yet compensation alone cannot address every consequence of the disaster.','For policymakers, the challenge extends beyond identifying those responsible. It also involves preventing similar tragedies, supporting affected communities and restoring public confidence in the institutions responsible for protecting them.','A year after the fire, the question is no longer simply what went wrong, but whether the lessons learned will lead to lasting change.']}],vocabulary:[['Pay tribute to','致敬；悼念','Show respect or honour someone.','Thousands gathered to pay tribute to the victims.','B2'],['Substandard','不符合標準的','Below an acceptable standard.','The investigation identified the use of substandard building materials.','B2'],['Regulatory oversight','監管及監督','Supervision to ensure compliance with regulations.','The report highlighted serious weaknesses in regulatory oversight.','C1'],['Enforce regulations','執行法規','Make sure that rules are obeyed.','Authorities must ensure that safety regulations are properly enforced.','B2'],['Hold someone accountable','追究某人的責任','Require someone to explain their actions and accept responsibility.','Residents want those responsible to be held accountable.','B2'],['Pledge to','承諾做某事','Make a serious promise to do something.','The government has pledged to strengthen building safety.','B2'],['Restore public confidence','恢復公眾信心','Rebuild people’s trust in institutions.','Transparent investigations can help restore public confidence.','B2+'],['Lasting change','持久的改變','Change that continues rather than being temporary.','The reforms must lead to lasting change rather than temporary improvements.','B2'],['Devastating','造成嚴重破壞的；令人極度悲痛的','Causing great damage or distress.','The devastating fire affected an entire community.','B2'],['Mourners','悼念者','People who grieve someone’s death.','Mourners gathered near the estate to lay flowers.','B2'],['Remembrance','追思；紀念','The act of remembering someone who has died.','The anniversary was a time of remembrance.','B2'],['Inadequate','不足的','Not sufficient or suitable for a purpose.','The investigation identified inadequate regulatory oversight.','B2'],['Discarded','被丟棄的','Thrown away or no longer wanted.','A discarded cigarette was mentioned in the investigation.','B2'],['Hazard','危險；隱患','Something that could cause harm.','Residents had raised concerns about fire hazards.','B2'],['Prompt questions','引起疑問','Cause people to ask questions.','The findings prompted questions about supervision.','B2'],['Resign','辭職','Leave a job or official position voluntarily.','The official resigned from the position.','B2'],['Compensation','賠償；補償','Money given for loss, injury or damage.','Compensation alone cannot address every consequence.','B2'],['Affected communities','受影響的社群','Groups of people harmed by an event or decision.','The policy should support affected communities.','B2']],language:[{title:'Beyond + noun',explanation:'Introduce a broader issue that extends further than the immediate subject.',quote:'Beyond the investigations, survivors continue to face practical and emotional difficulties.',examples:['Beyond financial assistance, the government must consider residents’ long term wellbeing.','Beyond economic growth, policymakers need to address social inequality.']},{title:'Whether + clause',explanation:'Introduce an issue whose outcome remains uncertain.',quote:'The question is whether the lessons learned will lead to lasting change.',examples:['It remains unclear whether the new regulations will be effective.','The public may question whether sufficient action has been taken.']}],analysis:'Responsibility concerns duties and obligations. Accountability involves explaining actions, scrutiny and consequences. Institutional reform concerns prevention and systemic improvement. Identifying an individual failure does not automatically repair the wider system; new regulations do not necessarily resolve questions about past accountability.',question:'Following a major public safety disaster, should the government’s priority be holding those responsible accountable or implementing reforms to prevent similar incidents?'},{"id":"gta-vi-2026-11-28","title":"GTA VI: A Record Breaking Success in a Struggling Games Industry","date":"2026-11-28","region":"International","category":"Gaming & Culture","type":"News analysis","level":"B2 / B2+","source":"Al Jazeera, Brian Osgood (19 November 2026) / Rockstar Games (20 November 2026), as cited in Lesson 03","sourceUrl":"","verified":false,"description":"Gaming culture, the economic power of blockbuster releases and job security in the creative industries.","sections":[{"id":"a","heading":"A cultural phenomenon","paragraphs":["When Grand Theft Auto VI was released on 19 November 2026, it marked the end of a 13 year wait for millions of fans.","The game had already generated enormous excitement before its launch, with players discussing trailers, characters and possible storylines across social media.","According to Rockstar Games, GTA VI generated approximately $3.79 billion in worldwide retail sales during its first 24 hours, setting a new entertainment record. The figure was based on the company's own estimates.","For many observers, the success demonstrates that video games are no longer a niche form of entertainment. They have become a major part of global popular culture, competing with films, television and music for audiences' attention."]},{"id":"b","heading":"More than entertainment","paragraphs":["The Grand Theft Auto series is famous for its open worlds, detailed environments and controversial themes.","Players can explore fictional American cities, complete missions and interact with characters whose lives reflect different aspects of society.","Although the games frequently feature crime and violence, some critics argue that they also offer social commentary on consumerism, inequality and American culture.","The popularity of GTA VI reflects both nostalgia among longtime fans and the extraordinary level of detail that modern games can achieve."]},{"id":"c","heading":"An industry under pressure","paragraphs":["Despite GTA VI's remarkable commercial success, the wider games industry has faced serious financial difficulties.","According to data cited by Al Jazeera, nearly 13,000 workers had been made redundant across the industry in 2026, while 40 game studios had closed.","During the COVID pandemic, many companies expanded their workforce as demand for games increased. However, that growth eventually slowed, while production costs continued to rise.","As a result, some developers have struggled to remain profitable, even as gaming becomes increasingly popular worldwide."]},{"id":"d","heading":"Why bigger does not always mean better","paragraphs":["Producing a modern blockbuster game can require hundreds of millions of dollars and several years of development.","Larger studios may have the resources to invest in ambitious projects, whereas smaller developers often face greater financial risks.","A successful title can generate substantial revenue, but this does not necessarily mean the benefits are shared equally across the industry.","Some experts believe GTA VI demonstrates the extraordinary potential of video games. Others warn that its success may be difficult for smaller companies to reproduce.","The situation raises a broader question: can the games industry continue to grow while providing sustainable careers for the people who create its products?"]}],"vocabulary":[["Phenomenon","現象","An event or situation that can be observed, especially an unusual or notable one.","GTA VI has become a global cultural phenomenon.","B2"],["Generate","產生、帶來","To produce or bring about something.","The game generated billions of dollars in sales.","B2"],["Revenue","收入、營業額","Money received by a business before costs are deducted.","The company reported record revenue last year.","B2"],["Niche","小眾的、專門的","Appealing to a small, specialised group.","Gaming is no longer a niche form of entertainment.","B2"],["Controversial","具爭議性的","Causing disagreement or public debate.","The game explores several controversial social issues.","B2"],["Consumerism","消費主義","An emphasis on buying and consuming goods and services.","The story offers a criticism of modern consumerism.","C1"],["Nostalgia","懷舊之情","A sentimental longing for the past.","The soundtrack creates a strong sense of nostalgia.","B2"],["Remarkable","非凡的、顯著的","Unusual or impressive enough to deserve attention.","The game achieved remarkable commercial success.","B2"],["Commercial","商業的","Relating to business or the sale of goods and services.","The film was a commercial success despite mixed reviews.","B2"],["Workforce","勞動人口、員工隊伍","The people employed by a company or working in an industry.","The company expanded its workforce during the pandemic.","B2"],["Redundant","因職位被裁撤而失去工作的","No longer employed because the job is no longer needed.","Hundreds of employees were made redundant.","B2"],["Profitable","有盈利的","Making more money than it costs to operate.","Smaller studios often struggle to remain profitable.","B2"],["Substantial","可觀的、大量的","Large in amount, size or importance.","Developing the game required substantial investment.","B2"],["Sustainable","可持續的","Able to continue over a long period.","The industry needs a more sustainable business model.","B2"],["Social commentary","對社會現象的評論","Expression that comments on or criticises aspects of society.","The game uses humour and satire as social commentary.","C1"],["Reproduce","重現、複製成果","To produce something again or achieve a similar result.","Other studios may struggle to reproduce its success.","B2"]],"language":[{"title":"Despite + noun","explanation":"Introduce a surprising contrast. Despite is normally followed by a noun or an ing form, not a complete clause.","quote":"Despite GTA VI's remarkable commercial success, the wider games industry has faced serious financial difficulties.","examples":["Despite its popularity, the game received mixed reviews.","Despite rising sales, the company decided to reduce its workforce."]},{"title":"Not necessarily","explanation":"Challenge an assumption by showing that something is not always true.","quote":"A successful title can generate substantial revenue, but this does not necessarily mean the benefits are shared equally across the industry.","examples":["Higher salaries do not necessarily lead to greater job satisfaction.","More investment does not necessarily guarantee better results."]}],"analysis":"Industry growth is not the same as job security. Blockbuster games can attract enormous audiences and generate substantial revenue, but development requires large investments, experienced employees and years of work. Success may be concentrated among major publishers; smaller studios do not necessarily benefit from the industry's popularity as a whole. The same distinction is relevant to film, music, advertising and design. The first day sales estimate and the industry job losses reported in the lesson measure different things and should not be directly compared.","question":"Do you think the growing popularity of video games will create more opportunities for creative workers, or will the industry become increasingly dominated by a small number of large companies?"}];
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), iso=()=>new Date().toISOString(), day=86400000, norm=s=>String(s).toLocaleLowerCase('en-GB').trim().replace(/\s+/g,' '), clone=x=>JSON.parse(JSON.stringify(x));
const stores=['lessons','highlights','cards','reviews','progress','settings','feedback'];let db, data={}, view='home', readerOrigin='library', current=null, libraryQuery='', region='', category='', level='', type='', readingStatus='', termQuery='', termFilter='all', review=null, reviewUtterance=null, selection=null, audio=null, speaking=false, speechToken=0, scrollTimer, toastTimer, storageOK=true;const app=$('#app');
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('marginalia-library',1);r.onupgradeneeded=()=>{for(const s of stores)if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function all(s){return new Promise((res,rej)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function writeMany(changes,clear=[]){return new Promise((res,rej)=>{let names=[...new Set([...changes.map(c=>c[0]),...clear])];if(!names.length)return res();let tx=db.transaction(names,'readwrite');for(const s of clear)tx.objectStore(s).clear();for(const [s,x,del] of changes){const st=tx.objectStore(s);del?st.delete(x):st.put(x)}tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||Error('Transaction aborted'))})}async function save(s,x){await writeMany([[s,x]]);data[s].set(x.id,x);return x}async function remove(s,id){await writeMany([[s,id,true]]);data[s].delete(id)}function list(s){return [...data[s].values()]}function setting(k,d){return data.settings.get(k)?.value??d}async function set(k,v){await save('settings',{id:k,value:v})}function toast(s){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast" role="status">${E(s)}</div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',3200)}function reportError(e){console.error(e);toast('Could not complete: '+e.message)}function safe(fn){return (...a)=>{try{return Promise.resolve(fn(...a)).catch(reportError)}catch(e){reportError(e)}}}function download(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function textOf(l){return l.sections.flatMap(s=>s.paragraphs).join(' ')}function minutes(l){return Math.max(1,Math.ceil(textOf(l).trim().split(/\s+/).length/setting('wpm',150)))}function prog(id){return data.progress.get(id)||{id,status:'unread',scroll:0,updatedAt:''}}function dueCards(){return list('cards').filter(c=>!c.suspended&&c.due<=Date.now()).sort((a,b)=>a.due-b.due)}function lessons(){return list('lessons').sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title))}function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}function cardKey(kind,term,meaning){return kind+'|'+norm(term)+'|'+norm(meaning)}function entryCard(v){return cardKey('vocab',v[0],v[1])}function button(label,action,attrs='',cls=''){return `<button class="${cls}" data-act="${action}" ${attrs}>${label}</button>`}function attr(k,v){return `data-${k}="${E(v)}"`}
function lessonTile(lesson,featured=false) {
  const progress = prog(lesson.id);
  const state = {unread:'',reading:'In progress',complete:'Read'}[progress.status];
  return `<article class="tile${featured ? ' featured-article' : ''}">
    <div class="meta">${E(lesson.category)} · ${minutes(lesson)} min · ${E(lesson.level)}${state && !featured ? ' · '+state : ''}</div>
    <h3>${featured ? E(lesson.title) : button(E(lesson.title),'open',attr('id',lesson.id),'article-title')}</h3>
    <p>${E(lesson.description)}</p>
    ${featured ? button(progress.status==='reading'?'Continue reading':progress.status==='complete'?'Read again':'Read article','open',attr('id',lesson.id),'primary') : ''}
  </article>`;
}
function navRender() {
  const tabs = [['home','Today'],['library','Library'],['words','Language'],['review','Review']];
  $('#nav').innerHTML = tabs.map(([key,label]) => {
    const selected = view===key || (view==='reader' && key==='library');
    return `<button data-go="${key}" ${selected?'class="on" aria-current="page"':''}>${label}${key==='review'&&dueCards().length?' · '+dueCards().length:''}</button>`;
  }).join('');
  const status = $('#status');
  status.textContent = storageOK ? '' : 'Storage unavailable';
}
function render(){navRender();if(view==='home')home();if(view==='library')library();if(view==='reader')reader();if(view==='words')words();if(view==='review')reviewPage();if(view==='notes')notes();if(view==='settings')settings();applyReaderFont()}
function go(v,id,origin=view){if(v==='reader'&&view!=='reader')readerOrigin=origin;const returningToReview=v==='review'&&view!=='review'&&review;if(view==='reader'&&(v!=='reader'||id!==current)){persistScroll();stopSpeech()}if(view==='review'&&v!=='review')stopCardSpeech();$('#moreMenu').open=false;selection=null;$('#overlay').innerHTML='';view=v;if(id)current=id;try{history.replaceState(null,'','#'+(v==='reader'?'article/'+encodeURIComponent(current):v))}catch{};render();window.scrollTo(0,0);if(returningToReview&&setting('reviewAutoRead',true))playCardSpeech();if(v==='reader'){let p=prog(current);if(p.scroll)requestAnimationFrame(()=>window.scrollTo(0,p.scroll));if(p.status==='unread')safe(()=>save('progress',{...p,status:'reading',updatedAt:iso()}))()}}

function home() {
  const articles = lessons();
  const active = articles.filter(lesson => prog(lesson.id).status==='reading')
    .sort((a,b) => prog(b.id).updatedAt.localeCompare(prog(a.id).updatedAt))[0];
  const featured = active || articles[0];
  const due = dueCards().length;
  app.innerHTML = `<div class="page-narrow">
    <h1 class="page-title">Today</h1>
    ${featured ? `<section class="today-feature">
      <h2>${active?'Continue reading':'Latest article'}</h2>
      ${lessonTile(featured,true)}
    </section>` : '<p class="empty">Import your first article in Settings.</p>'}
    ${due ? `<div class="today-review"><span>${due} ${due===1?'card':'cards'} due</span>${button('Open review','go',attr('target','review'),'text')}</div>` : ''}
    ${articles.length>1 ? `<div class="sectionhead"><h2>More to read</h2><button class="text" data-go="library">View library</button></div>
      <div class="article-list">${articles.filter(lesson=>lesson!==featured).slice(0,3).map(lesson=>lessonTile(lesson)).join('')}</div>` : ''}
  </div>`;
}
function options(values,selected,placeholder){return `<option value="">${E(placeholder)}</option>`+[...new Set(values)].sort().map(x=>`<option ${x===selected?'selected':''} value="${E(x)}">${E(x)}</option>`).join('')}

function library(filtersOpen=false) {
  const articles = lessons(), query = norm(libraryQuery);
  const matches = articles.filter(l => (!region || l.region===region) && (!category || l.category===category)
    && (!level || l.level===level) && (!type || l.type===type)
    && (!readingStatus || (readingStatus==='saved' ? prog(l.id).bookmarked : prog(l.id).status===readingStatus))
    && (!query || norm([l.title,l.description,l.region,l.category,l.source,textOf(l),...l.vocabulary.flat()].join(' ')).includes(query)));
  const activeFilters = [region,category,level,type,readingStatus].filter(Boolean).length;
  app.innerHTML = `<div class="page-narrow">
    <h1 class="page-title">Library</h1>
    <div class="library-search">
      <input id="libraryQuery" aria-label="Search articles" type="search" placeholder="Search articles" value="${E(libraryQuery)}">
      <details id="libraryFilters" ${filtersOpen?'open':''}>
        <summary>Filters${activeFilters?' ('+activeFilters+')':''}</summary>
        <div class="filter-options">
          <label>Region<select id="region">${options(articles.map(l=>l.region),region,'All regions')}</select></label>
          <label>Topic<select id="category">${options(articles.map(l=>l.category),category,'All topics')}</select></label>
          <label>Level<select id="level">${options(articles.map(l=>l.level),level,'All levels')}</select></label>
          <label>Format<select id="type">${options(articles.map(l=>l.type),type,'All formats')}</select></label>
          <label>Reading status<select id="readingStatus">${options(['unread','reading','complete','saved'],readingStatus,'Any status')}</select></label>
          ${activeFilters?'<button class="text" id="clearLibraryFilters">Clear filters</button>':''}
        </div>
      </details>
    </div>
    ${query||activeFilters ? `<p class="meta">${matches.length} of ${articles.length} articles</p>` : ''}
    <div class="article-list">${matches.map(lesson=>lessonTile(lesson)).join('')||'<p class="empty">No matching articles.</p>'}</div>
  </div>`;
  $('#libraryQuery').oninput = event => {
    libraryQuery = event.target.value;
    const open = $('#libraryFilters').open;
    refreshInput('libraryQuery',()=>library(open));
  };
  for (const [key,update] of Object.entries({region:v=>region=v,category:v=>category=v,level:v=>level=v,type:v=>type=v,readingStatus:v=>readingStatus=v})) {
    $('#'+key).onchange = event => { update(event.target.value); library(true); $('#'+key).focus(); };
  }
  const clear = $('#clearLibraryFilters');
  if (clear) clear.onclick = () => { region=category=level=type=readingStatus=''; library(true); $('#libraryFilters summary').focus(); };
}
function refreshInput(id,fn){let el=$('#'+id),p=el.selectionStart;fn();let n=$('#'+id);n.focus();try{n.setSelectionRange(p,p)}catch{}}

function vocabRow(entry,lessonId,sources=[]) {
  const [term,meaning,definition,example,level] = entry;
  const key = entryCard(entry);
  const saved = data.cards.has(key);
  const articles = sources.map(lesson => button(E(lesson.title),'open',attr('id',lesson.id),'text')).join('');
  return `<div class="vocab-entry">
    <details data-disclosure="${E(key)}">
      <summary><strong>${E(term)}</strong><span lang="zh-Hant">${E(meaning)}</span></summary>
      <div class="vocab-detail">
        ${level?`<p class="meta">${E(level)}</p>`:''}

const minReaderFont = 18, maxReaderFont = 28;
let fontSizeUpdate = Promise.resolve();

function readerFontSize() {
  return setting('fontSize',20);
}

function applyReaderFont() {
  const size = readerFontSize();
  document.documentElement.style.setProperty('--read',size+'px');
  const output = $('#readerFontSize');
  if (!output) return;
  output.value = size;
  $('[data-act=font][data-delta="-1"]').setAttribute('aria-disabled',size<=minReaderFont);
  $('[data-act=font][data-delta="1"]').setAttribute('aria-disabled',size>=maxReaderFont);
}

function adjustReaderFont(delta) {
  fontSizeUpdate = fontSizeUpdate.catch(()=>{}).then(async () => {
    const size = readerFontSize();
    const next = Math.min(maxReaderFont,Math.max(minReaderFont,size+delta));
    if (next === size) return;
    await set('fontSize',next);
    const bar = $('.reader-bar');
    const line = bar?.getBoundingClientRect().bottom;
    const anchor = bar && [...app.querySelectorAll('#articleText h2, #articleText p')]
      .find(node => {
        const bounds = node.getBoundingClientRect();
        return bounds.bottom > line && bounds.top < window.innerHeight && window.scrollY > 0;
      });
    const before = anchor?.getBoundingClientRect();
    applyReaderFont();
    if (before) {
      const after = anchor.getBoundingClientRect();
      // Preserve the approximate place within a paragraph that starts above the toolbar.
      const fraction = Math.max(0,(line-before.top)/before.height);
      window.scrollBy(0,after.top-before.top + fraction*(after.height-before.height));
    }
  });
  return fontSizeUpdate;
}

function cardIsReversed(card) {
  if (card.kind === 'language') return false;
  const direction = setting('reviewDirection','mixed');
  return direction === 'meaning' || (direction === 'mixed' && card.reps % 2 === 1);
}

function cardSpeechText() {
  if (view !== 'review' || !review || review.saving) return '';
  const card = data.cards.get(review.ids[review.index]);
  return card && (review.revealed || !cardIsReversed(card)) ? card.term : '';
}

function hasCardSpeech() {
  return !!(globalThis.speechSynthesis && globalThis.SpeechSynthesisUtterance);
}

function updateCardSpeechControls() {
  const play = $('[data-act=playCard]');
  if (!play) return;
  play.textContent = reviewUtterance ? 'Stop audio' : 'Listen';
  $('#reviewAudioStatus').textContent = review?.audioMessage || '';
}

function stopCardSpeech() {
  if (!reviewUtterance) return;
  reviewUtterance = null;
  speechSynthesis.cancel();
  updateCardSpeechControls();
}

function playCardSpeech() {
  const text = cardSpeechText();
  if (!text || !hasCardSpeech() || document.hidden) return;
  stopCardSpeech();
  review.audioMessage = '';
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-GB';
  const voice = speechVoice();
  if (voice) utterance.voice = voice;
  utterance.rate = setting('rate', 1);
  utterance.onend = () => {
    if (reviewUtterance !== utterance) return;
    reviewUtterance = null;
    updateCardSpeechControls();
  };
  utterance.onerror = event => {
    if (reviewUtterance !== utterance) return;
    reviewUtterance = null;
    review.audioMessage = event.error === 'not-allowed'
      ? 'Tap Listen to enable audio.'
      : 'Audio is unavailable. You can try Listen again.';
    updateCardSpeechControls();
  };
  reviewUtterance = utterance;
  updateCardSpeechControls();
  speechSynthesis.speak(utterance);
}

  if (!review || review.revealed || review.saving) return;

async function rateReviewCard(element) {
  const session = review;
  if (!session?.revealed || session.saving) return;
  const card = data.cards.get(session.ids[session.index]);
  const rating = Number(element.dataset.rating);
  stopCardSpeech();
  session.saving = true;
  const buttons = app.querySelectorAll('[data-act=rateCard]');
  buttons.forEach(button => { button.disabled = true; });
  try {
    if (session.mode === 'due') {
      const next = schedule(card,rating);
      const event = {id:uid(),cardId:card.id,date:iso(),rating,priorInterval:card.interval,nextInterval:next.interval,nextDue:next.due};
      await writeMany([['cards',next],['reviews',event]]);
      data.cards.set(next.id,next);
      data.reviews.set(event.id,event);
    }
  } finally {
    session.saving = false;
    if (review === session && view === 'review') {
      app.querySelectorAll('[data-act=rateCard]').forEach(button => { button.disabled = false; });
    }
  }
  session.done++;
  if (rating >= 2) session.correct++;
  session.index++;
  session.revealed = false;
  if (review === session && view === 'review') showReviewCard();
